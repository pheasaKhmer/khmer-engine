[project]
name = "khmer-engine"
dynamic = ["version"]
description = "Convert chat-style romanized Khmer to Khmer script and back."
readme = "README.md"
requires-python = ">=3.11"
# Code is MIT. The bundled sample data keeps the licenses of its sources (data/README.md).
license = "MIT AND CC-BY-4.0 AND ODC-By-1.0"
license-files = ["LICENSE"]
authors = [{ name = "Samputhy Khim" }]
maintainers = [{ name = "Samputhy Khim" }]
keywords = ["khmer", "romanization", "transliteration", "input-method", "nlp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = ["pheasa>=0.1.0"]

[project.scripts]
khmer-engine = "khmer_engine.cli:main"

[project.urls]
Homepage = "https://github.com/pheasaKhmer/khmer-engine"
Repository = "https://github.com/pheasaKhmer/khmer-engine"
Issues = "https://github.com/pheasaKhmer/khmer-engine/issues"

[dependency-groups]
data = [
    "pyarrow>=25.0.1",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

# pheasa is not on PyPI yet. Remove this once it is published.
[tool.uv.sources]
pheasa = { git = "https://github.com/pheasaKhmer/pheasa", rev = "31c5b83d3685a82be53dc87fbd6c3a72a1299040" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/khmer_engine/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["/src/khmer_engine", "/LICENSE", "/README.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# IPA letters in phonemic transcriptions, not typos for a and ?.
allowed-confusables = ["ɑ", "ʔ"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
